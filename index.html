<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家事選択</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px 16px 80px 16px;
      margin: 0;
      background-color: #f4f5f7;
    }
    #status {
      margin-bottom: 12px;
      font-weight: bold;
      color: #555;
      text-align: center;
    }

    /* ① カテゴリ選択タブエリア */
    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .tab-btn {
      background: #ffffff;
      border: 1px solid #ccc;
      color: #666;
      border-radius: 16px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #06C755;
      border-color: #06C755;
      color: #ffffff;
    }

    /* ② 家事カード一覧エリア */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .chore-card {
      background: #ffffff;
      border: 2px solid #e0e0e0;
      color: #333;
      border-radius: 12px;
      padding: 16px 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      position: relative;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .chore-card.selected {
      background-color: #06C755;
      border-color: #06C755;
      color: #ffffff;
    }
    .chore-card .check-icon {
      display: none;
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 12px;
      font-weight: bold;
    }
    .chore-card.selected .check-icon { display: block; }

    /* 下部固定フッター */
    .footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #ffffff;
      padding: 12px 16px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
      display: flex;
      justify-content: center;
      z-index: 100;
    }
    .submit-btn {
      width: 100%; max-width: 400px;
      background-color: #06C755; color: #ffffff;
      border: none; border-radius: 24px;
      padding: 14px 0; font-size: 16px; font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

  <div id="status">家事マスタを読み込み中...</div>

  <!-- カテゴリタブ一覧エリア -->
  <div class="category-tabs" id="categoryTabs"></div>

  <!-- 家事カード一覧エリア -->
  <div class="grid" id="choreGrid"></div>

  <!-- 送信ボタン -->
  <div class="footer">
    <button id="submitBtn" class="submit-btn" disabled onclick="sendChores()">
      家事を記録する (0)
    </button>
  </div>

  <script>
    const MY_LIFF_ID = "2011411807-WdTV4hX7";
    // ★ご自身のGASのデプロイURLを設定してください
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzlAFbG5mz0uS1s-I5TjM3foKAIzvOSsnYHsoSBnLRod4VlVJeL3n5lVYxfomUEfHyQrg/exec";

    let allChores = [];               // オブジェクト配列 [{ name, category }, ...] を保持
    let currentCategory = 'すべて';    // 選択中のカテゴリ
    const selectedChores = new Set();  // 選択中の家事名セット

    window.onload = function() {
      if (typeof liff === 'undefined') {
        document.getElementById('status').innerText = "エラー: LIFF SDKが読み込めません";
        return;
      }

      liff.init({ liffId: MY_LIFF_ID })
        .then(() => {
          const context = liff.getContext();
          const groupId = context ? (context.groupId || context.roomId || context.userId || '') : '';
          fetchGroupChores(groupId);
        })
        .catch(err => {
          document.getElementById('status').innerText = "初期化失敗: " + err.message;
        });
    };

    function fetchGroupChores(groupId) {
      const statusEl = document.getElementById('status');
      const url = `${GAS_WEB_APP_URL}?action=getChores&groupId=${encodeURIComponent(groupId)}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          // オブジェクト配列かつ要素数が1以上あるか判定
          if (Array.isArray(data) && data.length > 0) {
            allChores = data;
            statusEl.innerText = "家事を選択してください（複数可）";
            renderCategories();
            renderCards();
          } else {
            statusEl.innerText = "登録されている家事マスタがありません";
          }
        })
        .catch(err => {
          console.error("取得エラー:", err);
          statusEl.innerText = "データ取得エラーが発生しました";
        });
    }

    // カテゴリタブの動的生成
    function renderCategories() {
      const tabsContainer = document.getElementById('categoryTabs');
      tabsContainer.innerHTML = '';

      // 重複なしのカテゴリ配列を作成（先頭に「すべて」を追加）
      const categories = ['すべて', ...new Set(allChores.map(c => c.category))];

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${cat === currentCategory ? 'active' : ''}`;
        btn.textContent = cat;
        btn.onclick = () => {
          currentCategory = cat;
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderCards();
        };
        tabsContainer.appendChild(btn);
      });
    }

    // 家事カードの絞り込み描画
    function renderCards() {
      const grid = document.getElementById('choreGrid');
      grid.innerHTML = '';

      // 選択中カテゴリでフィルタリング（"食事", "洗濯", "掃除"など）
      const filtered = currentCategory === 'すべて' 
        ? allChores 
        : allChores.filter(c => c.category === currentCategory);

      filtered.forEach(item => {
        const btn = document.createElement('button');
        const isSelected = selectedChores.has(item.name);
        btn.className = `chore-card ${isSelected ? 'selected' : ''}`;
        btn.onclick = () => toggleSelect(btn, item.name);

        btn.innerHTML = `
          <span class="check-icon">✓</span>
          <span class="name">${item.name}</span>
        `;
        grid.appendChild(btn);
      });
    }

    // カードの選択・解除切り替え
    function toggleSelect(element, choreName) {
      if (selectedChores.has(choreName)) {
        selectedChores.delete(choreName);
        element.classList.remove('selected');
      } else {
        selectedChores.add(choreName);
        element.classList.add('selected');
      }
      updateSubmitButton();
    }

    // 下部ボタン表示更新
    function updateSubmitButton() {
      const submitBtn = document.getElementById('submitBtn');
      const count = selectedChores.size;
      submitBtn.disabled = count === 0;
      submitBtn.textContent = `家事を記録する (${count})`;
    }

    // 選択家事の一括送信
    function sendChores() {
      if (!liff.isInClient() || selectedChores.size === 0) return;

      const textToSend = Array.from(selectedChores).join('\n');
      liff.sendMessages([{ type: 'text', text: textToSend }])
        .then(() => liff.closeWindow())
        .catch(err => alert("送信エラー: " + err.message));
    }
  </script>
</body>
</html>
