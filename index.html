<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家事選択</title>
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; background: #f4f5f7; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
    button {
      padding: 20px 10px; font-size: 16px; font-weight: bold; color: #06C755;
      background: #fff; border: 2px solid #06C755; border-radius: 10px; cursor: pointer;
    }
    button:disabled { opacity: 0.5; border-color: #ccc; color: #ccc; cursor: not-allowed; }
    #status { margin-bottom: 10px; font-weight: bold; color: #555; }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

  <div id="status">画面を準備中...</div>

  <div class="grid">
    <button class="chore-btn" onclick="sendChore('朝食準備')" disabled>朝食準備</button>
    <button class="chore-btn" onclick="sendChore('夕食調理')" disabled>夕食調理</button>
    <button class="chore-btn" onclick="sendChore('食器洗い')" disabled>食器洗い</button>   
    <button class="chore-btn" onclick="sendChore('食洗機セット・片付け')" disabled>食洗機セット・片付け</button>
    <button class="chore-btn" onclick="sendChore('麦茶')" disabled>麦茶</button>
    <button class="chore-btn" onclick="sendChore('洗濯・干し')" disabled>洗濯・干し</button>
    <button class="chore-btn" onclick="sendChore('洗濯畳み・収納')" disabled>洗濯畳み・収納</button>
    <button class="chore-btn" onclick="sendChore('お風呂掃除')" disabled>お風呂掃除</button>
    <button class="chore-btn" onclick="sendChore('ゴミ集め・ゴミ出し')" disabled>ゴミ集め・ゴミ出し</button>
  </div>

  <script>
    const MY_LIFF_ID = "2011411807-WdTV4hX7";
    let isReady = false;

    window.onload = function() {
      const statusEl = document.getElementById('status');

      if (typeof liff === 'undefined') {
        statusEl.innerText = "エラー: LIFF SDKが読み込めません";
        return;
      }

      liff.init({ liffId: MY_LIFF_ID })
        .then(() => {
          isReady = true;
          statusEl.innerText = "家事を選択してください";
          document.querySelectorAll('.chore-btn').forEach(btn => btn.disabled = false);
        })
        .catch((err) => {
          statusEl.innerText = "初期化失敗: " + err.message;
        });
    };

    function sendChore(choreName) {
      if (!isReady) return;

      if (!liff.isInClient()) {
        alert("LINEアプリ内のトーク画面から開いてください。");
        return;
      }

      liff.sendMessages([{ type: 'text', text: choreName }])
        .then(() => {
          liff.closeWindow();
        })
        .catch((err) => {
          alert("送信エラー: " + err.message);
        });
    }
  </script>
</body>
</html>
