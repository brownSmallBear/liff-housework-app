<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家事選択</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px 16px 80px 16px;
      margin: 0;
      background-color: #f4f5f7;
    }
    #status {
      margin-bottom: 12px;
      font-weight: bold;
      color: #333;
      text-align: center;
      word-break: break-all;
    }
    /* エラー表示用のスタイル */
    .error-msg {
      color: #d93025;
      background: #fce8e6;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #fad2cf;
      margin-bottom: 12px;
      font-size: 13px;
    }

    /* タブエリア */
    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .tab-btn {
      background: #ffffff;
      border: 1px solid #ccc;
      color: #666;
      border-radius: 16px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #06C755;
      border-color: #06C755;
      color: #ffffff;
    }

    /* 家事カード一覧 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .chore-card {
      background: #ffffff;
      border: 2px solid #e0e0e0;
      color: #333;
      border-radius: 12px;
      padding: 16px 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      position: relative;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .chore-card.selected {
      background-color: #06C755;
      border-color: #06C755;
      color: #ffffff;
    }
    .chore-card .check-icon {
      display: none;
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 12px;
    }
    .chore-card.selected .check-icon { display: block; }

    /* フッター */
    .footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #ffffff;
      padding: 12px 16px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
      display: flex;
      justify-content: center;
      z-index: 100;
    }
    .submit-btn {
      width: 100%; max-width: 400px;
      background-color: #06C755; color: #ffffff;
      border: none; border-radius: 24px;
      padding: 14px 0; font-size: 16px; font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

  <div id="status">システム初期化中...</div>

  <!-- カテゴリタブ -->
  <div class="category-tabs" id="categoryTabs"></div>

  <!-- 家事カード一覧 -->
  <div class="grid" id="choreGrid"></div>

  <!-- 下部送信ボタン -->
  <div class="footer">
    <button id="submitBtn" class="submit-btn" disabled onclick="sendChores()">
      家事を記録する (0)
    </button>
  </div>

  <script>
    // ★エラーが起きたら画面上に赤文字で出力するデバッグコード
  window.onerror = function(msg, url, line) {
    const statusEl = document.getElementById('status');
    if (statusEl) {
      statusEl.style.color = 'red';
      statusEl.innerText = "エラー発生: " + msg + " (行: " + line + ")";
    }
    return false;
  };

  const MY_LIFF_ID = "2011411807-WdTV4hX7";
  // ... 以下既存のコード

    
    // ★★★ 注意: クォーテーションを重ねず、以下のように正しく記述してください ★★★
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzlAFbG5mz0uS1s-I5TjM3foKAIzvOSsnYHsoSBnLRod4VlVJeL3n5lVYxfomUEfHyQrg/exec";

    let allChores = [];
    let currentCategory = 'すべて';
    const selectedChores = new Set();

    window.onload = function() {
      if (typeof liff === 'undefined') {
        document.getElementById('status').innerText = "エラー: LIFF SDKの読み込みに失敗しました";
        return;
      }

      liff.init({ liffId: MY_LIFF_ID })
        .then(() => {
          const context = liff.getContext();
          let groupId = "C5d26c0e5882bc843b9d72e20563cd2a0";
          //(!groupId) {
          // ★ここに管理台帳（スプレッドシート）のA列に書いてあるグループIDを直接貼り付けてテスト
          //  targetGroupId = "C5d26c0e5882bc843b9d72e20563cd2a0";
          //}
          document.getElementById('status').innerText = "データ取得中...";
          fetchGroupChores(groupId);
        })
        .catch(err => {
          const statusEl = document.getElementById('status');
          statusEl.className = 'error-msg';
          statusEl.innerText = "LIFF初期化エラー: " + err.message;
        });
    };

    function fetchGroupChores(groupId) {
      const statusEl = document.getElementById('status');
      const url = `${GAS_WEB_APP_URL}?action=getChores&groupId=${encodeURIComponent(groupId)}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (Array.isArray(data) && data.length > 0) {
            allChores = data;
            statusEl.innerText = "家事を選択してください（複数可）";
            statusEl.className = '';
            renderCategories();
            renderCards();
          } else {
            statusEl.innerText = "家事マスタが登録されていません (データ数: 0)";
          }
        })
        .catch(err => {
          statusEl.className = 'error-msg';
          statusEl.innerText = "通信エラー: " + err.message;
        });
    }

    function renderCategories() {
      const tabsContainer = document.getElementById('categoryTabs');
      tabsContainer.innerHTML = '';

      const categories = ['すべて'];
      allChores.forEach(item => {
        if (item.category && !categories.includes(item.category)) {
          categories.push(item.category);
        }
      });

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${cat === currentCategory ? 'active' : ''}`;
        btn.textContent = cat;
        btn.onclick = () => {
          currentCategory = cat;
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderCards();
        };
        tabsContainer.appendChild(btn);
      });
    }

    function renderCards() {
      const grid = document.getElementById('choreGrid');
      grid.innerHTML = '';

      const filtered = currentCategory === 'すべて' 
        ? allChores 
        : allChores.filter(c => c.category === currentCategory);

      filtered.forEach(item => {
        const btn = document.createElement('button');
        const isSelected = selectedChores.has(item.name);
        btn.className = `chore-card ${isSelected ? 'selected' : ''}`;
        btn.onclick = () => toggleSelect(btn, item.name);

        btn.innerHTML = `
          <span class="check-icon">✓</span>
          <span class="name">${item.name}</span>
        `;
        grid.appendChild(btn);
      });
    }

    function toggleSelect(element, choreName) {
      if (selectedChores.has(choreName)) {
        selectedChores.delete(choreName);
        element.classList.remove('selected');
      } else {
        selectedChores.add(choreName);
        element.classList.add('selected');
      }
      updateSubmitButton();
    }

    function updateSubmitButton() {
      const submitBtn = document.getElementById('submitBtn');
      const count = selectedChores.size;
      submitBtn.disabled = count === 0;
      submitBtn.textContent = `家事を記録する (${count})`;
    }

    function sendChores() {
      if (!liff.isInClient() || selectedChores.size === 0) return;

      const textToSend = Array.from(selectedChores).join('\n');
      liff.sendMessages([{ type: 'text', text: textToSend }])
        .then(() => liff.closeWindow())
        .catch(err => alert("送信エラー: " + err.message));
    }
  </script>
</body>
</html>
